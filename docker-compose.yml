version: '3.9'

services:
  postgres:
    image: postgres:15-bookworm
    container_name: payouts_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    ports:
      - "5432:5432"
    volumes:
      - ./pg_data:/var/lib/postgresql/data

